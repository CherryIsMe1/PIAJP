{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gry</title>
    <link rel="stylesheet" href="{% static 'games/css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="container navbar-content">
            <span class="logo">Gry</span>
            <nav class="nav-links">
                <a href="/admin/" target="_blank">Admin</a>
                <a href="/api/gry/" target="_blank">API: Wszystkie</a>
                <a href="/api/gry/?sort=-price" target="_blank">ORM: Sortowanie</a>
                <a href="/api/gry/?decksup=true" target="_blank">ORM: Filtr SteamOS</a>
                <a href="/api/gry/?limit=3" target="_blank">ORM: Limit 3</a>
                <a href="/api/gry/1/" target="_blank">ORM: Gra #1</a>
                <a href="/api/statystyki/" target="_blank">Statystyki API</a>
            </nav>
        </div>
    </header>

    <div class="container main-wrapper">
        <section class="info-section">
            <h1>Katalog gier</h1>
            <p class="subtitle">Lab 5 - modele, migracje i zapytania ORM</p>
        </section>

        <section class="panel filters-panel">
            <h2>Filtry</h2>
            <form id="filter-form" onsubmit="return false;">
                <div class="form-row">
                    <div class="form-field">
                        <label for="filter-available">Stan:</label>
                        <select id="filter-available">
                            <option value="">Wszystko</option>
                            <option value="true">Dostępne</option>
                            <option value="false">Niedostępne</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="filter-genre">Gatunek:</label>
                        <select id="filter-genre">
                            <option value="">Wszystkie</option>
                            {% for g in genres %}
                                <option value="{{ g }}">{{ g }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="filter-status">Status:</label>
                        <select id="filter-status">
                            <option value="">Wszystkie</option>
                            {% for value, label in statuses %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="filter-platform">Platforma:</label>
                        <select id="filter-platform">
                            <option value="">Wszystkie</option>
                            {% for value, label in platforms %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="filter-decksup">SteamOS:</label>
                        <select id="filter-decksup">
                            <option value="">Wszystkie</option>
                            <option value="true">Tylko ze wsparciem</option>
                            <option value="false">Bez wsparcia</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="filter-search">Szukaj:</label>
                        <input type="text" id="filter-search" placeholder="np. Wiedźmin...">
                    </div>

                    <div class="form-field">
                        <label for="filter-sort">Sortowanie:</label>
                        <select id="filter-sort">
                            <option value="-release_year">Rok premiery (malejąco)</option>
                            <option value="release_year">Rok premiery (rosnąco)</option>
                            <option value="-rating">Ocena (malejąco)</option>
                            <option value="rating">Ocena (rosnąco)</option>
                            <option value="price">Cena (rosnąco)</option>
                            <option value="-price">Cena (malejąco)</option>
                            <option value="-decksup">SteamOS (najpierw ze wsparciem)</option>
                            <option value="title">Tytuł (A-Z)</option>
                            <option value="-title">Tytuł (Z-A)</option>
                            <option value="-added_date">Data dodania (najnowsze)</option>
                        </select>
                    </div>

                    <div class="form-field submit-field">
                        <button type="button" id="btn-fetch" class="btn btn-primary">Pobierz</button>
                    </div>
                </div>
            </form>

            <div class="query-info">
                URL: <code id="api-url-preview">/api/gry/</code>
            </div>
        </section>

        <section class="alerts-area">
            <div id="loading-spinner" class="alert alert-info hidden">
                Ładowanie...
            </div>

            <div id="error-box" class="alert alert-danger hidden">
                Błąd: <span id="error-details"></span>
            </div>

            <div id="empty-box" class="alert alert-warning hidden">
                Brak wyników.
            </div>

            <div id="summary-bar" class="summary-text hidden">
                <span id="summary-count"></span>
            </div>
        </section>

        <section class="results-area">
            <div id="games-container" class="games-list">
            </div>
        </section>
    </div>

    <footer class="footer">
        <div class="container">
            <p>Laboratorium 5</p>
        </div>
    </footer>

    <script src="{% static 'games/js/app.js' %}"></script>
</body>
</html>
